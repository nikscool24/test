---
name: Secret-Scan

on:
  workflow_call:
   
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret Scanner
        uses: secret-scanner/action@0.0.2  

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      