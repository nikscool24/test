---
name: Code Quality

on:
  workflow_call:

jobs:
  validate:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9","3.10","3.11","3.12","3.13","3.14"]
    steps:
      - name: code-checkout
        uses: actions/checkout@v4

      - name: setup python ${{matrix.python-version}}
        uses: actions/setup-pyton@v5
        with:
          python-version: ${{matrix.python-version}} 

      - name: install dependencies
        uses: pip install -r requirements.txt

      - name: run linter
        run: flake8 app.py      

      - name: run SAST
        run: bandit -r app.py   